<?xml version="1.0" encoding="UTF-8"?>
<!--
  Colour regions sample, 200 x 200 mm.
  The whole piece is one red square (the pattern). Everything inside it is a different colour, so each colour
  is its own region with its own role: blue = hole, green / yellow = solid, magenta / cyan / black = lines.
  The dark red (#cc0000) and the orange (#ff8000) are not palette colours; they show how an off-palette shade is read.
  Row 3 shows a lace: a green body with a blue opening and a red window (pattern inside the solid).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="200mm" viewBox="0 0 200 200">
  <!-- the piece: red = filled with the pattern -->
  <rect id="piece-red" x="4" y="4" width="192" height="192" fill="#ff0000" stroke="none"/>

  <!-- Row 1: one solid in each fill colour -->
  <rect id="r1-blue-hole"   x="14"  y="14" width="30" height="30" fill="#0000ff" stroke="none"/>
  <circle id="r1-green"     cx="75" cy="29" r="15"               fill="#00ff00" stroke="none"/>
  <rect id="r1-yellow"      x="104" y="14" width="30" height="30" fill="#ffff00" stroke="none"/>
  <rect id="r1-magenta"     x="142" y="14" width="22" height="30" fill="#ff00ff" stroke="none"/>
  <rect id="r1-cyan"        x="170" y="14" width="16" height="30" fill="#00ffff" stroke="none"/>

  <!-- Row 2: nesting and shades -->
  <!-- a green button on a blue hole's neighbour, a red island inside a blue hole (pattern again) -->
  <rect id="r2-blue-hole"   x="14"  y="58" width="30" height="30" fill="#0000ff" stroke="none"/>
  <circle id="r2-red-island" cx="29" cy="73" r="8"               fill="#ff0000" stroke="none"/>
  <rect id="r2-dark-red"    x="58"  y="58" width="30" height="30" fill="#cc0000" stroke="none"/>
  <rect id="r2-orange"      x="102" y="58" width="30" height="30" fill="#ff8000" stroke="none"/>
  <rect id="r2-green-a"     x="146" y="58" width="16" height="30" fill="#00ff00" stroke="none"/>
  <rect id="r2-green-b"     x="170" y="58" width="16" height="30" fill="#00ff00" stroke="none"/>

  <!-- Row 3: a lace (green body, blue opening, red window) then open lines and a ring -->
  <rect id="r3-lace-body"   x="14" y="102" width="70" height="40" fill="#00ff00" stroke="none"/>
  <circle id="r3-lace-open" cx="32" cy="122" r="8"                fill="#0000ff" stroke="none"/>
  <circle id="r3-lace-win"  cx="62" cy="122" r="11"               fill="#ff0000" stroke="none"/>
  <polyline id="r3-black-zigzag" points="96,138 112,108 128,138 144,108" fill="none" stroke="#000000" stroke-width="0.45"/>
  <path id="r3-magenta-wave" d="M 96 142 C 104 130, 114 154, 124 142 S 144 130, 154 142" fill="none" stroke="#ff00ff" stroke-width="0.45"/>
  <circle id="r3-cyan-ring" cx="174" cy="122" r="12" fill="none" stroke="#00ffff" stroke-width="0.45"/>

  <!-- Row 4: line widths, then a yellow solid in a blue frame -->
  <line id="r4-black-thin"  x1="14" y1="158" x2="74" y2="158" stroke="#000000" stroke-width="0.45"/>
  <line id="r4-black-1.2"   x1="14" y1="168" x2="74" y2="168" stroke="#000000" stroke-width="1.2"/>
  <line id="r4-magenta-1.2" x1="14" y1="178" x2="74" y2="178" stroke="#ff00ff" stroke-width="1.2"/>
  <rect id="r4-blue-frame"  x="96" y="152" width="90" height="36" fill="#0000ff" stroke="none"/>
  <rect id="r4-yellow-core" x="112" y="160" width="58" height="20" fill="#ffff00" stroke="none"/>
</svg>
