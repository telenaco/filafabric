<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500mm" height="450mm" viewBox="0 0 500 450">
  <title>Filafabric garment sample: lace-up crop top front</title>
  <desc>A lace-up V-neck crop top front, women's M, drawn at full size in millimetres (460 x 408 mm).
Red closed shape: the garment piece, filled with the pattern.
Blue circles: lacing eyelets, left open; their edge prints as a rim round each one.
Blue diamonds: cut-outs, left empty.
Black lines: reinforcing lines printed as drawn; 1.2 mm wide is three passes, 0.8 mm two.
Too big for your bed? Type a smaller width in Size and shape: the whole drawing scales with it.</desc>
