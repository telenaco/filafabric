<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="110mm" viewBox="0 0 170 110">
  <title>Filafabric lace sample</title>
  <desc>A lace medallion, 170 x 110 mm. The innermost shape decides what prints in each place:
green prints solid, red prints the pattern you choose, blue is left empty.
Green outline: the solid lace body. Blue circles: open eyelets. Red petals and centre: windows of pattern.
Blue inside the red centre: a hole in the pattern. Green dot inside a red petal: a solid dot on top of the pattern.</desc>
