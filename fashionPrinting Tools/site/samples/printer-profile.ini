# Example only: replace these values and the start/end G-code for your actual printer before printing.
# Import this complete config in Printer setup. Layer height is a PRINT setting, not just a nozzle property.
# A printer-only slicer preset may omit layer_height; the studio then uses a nozzle-based default.
printer_settings_id = Example printer - 0.9 mm nozzle
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 210
gcode_flavor = marlin2
nozzle_diameter = 0.9
layer_height = 0.45
machine_limits_usage = emit_to_gcode
machine_max_feedrate_x = 200
machine_max_feedrate_y = 200
machine_max_feedrate_z = 12
machine_max_feedrate_e = 120
machine_max_acceleration_x = 1000
machine_max_acceleration_y = 1000
machine_max_acceleration_z = 200
machine_max_acceleration_e = 5000
machine_max_acceleration_extruding = 800
machine_max_acceleration_retracting = 1000
machine_max_acceleration_travel = 1500
machine_max_jerk_x = 8
machine_max_jerk_y = 8
machine_max_jerk_z = 0.4
machine_max_jerk_e = 4.5
# G-code is one config line; literal \n sequences separate its commands.
start_gcode = G90\nM83\nM140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG28\nM107
end_gcode = G1 Z{max_layer_z + 2} F720\nM104 S0\nM140 S0\nM107\nM84
# Filament settings are optional in a printer file; including them imports a filament profile too.
# These are example values, NOT a validated TPU preset. Use the filament maker's recommendations.
filament_settings_id = Example filament - verify temperatures and flow
filament_diameter = 1.75
filament_density = 1.24
temperature = 230
first_layer_temperature = 230
bed_temperature = 50
extrusion_multiplier = 1
filament_max_volumetric_speed = 2
retract_length = 0
retract_speed = 20
retract_lift = 0
retract_before_travel = 2
min_fan_speed = 0
